name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Content published]
    types: [completed]
    branches: [content]

permissions:
  contents: read

concurrency:
  group: worker-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref_type == 'branch' &&
      (github.event_name != 'workflow_run' ||
        (github.ref == 'refs/heads/main' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'content' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      # Resolve the branch again so re-running an old run builds its latest commit.
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.ref_name }}
      - name: Check content checkout path
        run: |
          if [ -e .deployment-content ] || [ -L .deployment-content ]; then
            echo '::error::Content checkout path already exists; refusing to overwrite it'
            exit 1
          fi
      - name: Check out content
        uses: actions/checkout@v7
        with:
          ref: refs/heads/content
          path: .deployment-content
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Resolve deployment
        id: target
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          content_dir="$GITHUB_WORKSPACE/.deployment-content/content"
          if [ ! -d "$content_dir" ]; then
            echo '::error::Content branch is missing its content directory'
            exit 1
          fi
          content_sha=$(git -C .deployment-content rev-parse HEAD)
          echo "name=$(node scripts/worker-name.mjs "$BRANCH")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "content_sha=$content_sha" >> "$GITHUB_OUTPUT"
          echo "content_dir=$content_dir" >> "$GITHUB_OUTPUT"
      - run: pnpm run build
        env:
          GITHUB_SHA: ${{ steps.target.outputs.sha }}
          CONTENT_DIR: ${{ steps.target.outputs.content_dir }}
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name ${{ steps.target.outputs.name }}
      - name: Publish deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          WORKER: ${{ steps.target.outputs.name }}
          COMMIT: ${{ steps.target.outputs.sha }}
          CONTENT_COMMIT: ${{ steps.target.outputs.content_sha }}
        run: |
          test -n "$DEPLOYMENT_URL"
          printf '## Deployment\n\nWorker: `%s`\n\nCode commit: `%s`\n\nContent commit: `%s`\n\nURL: %s\n' "$WORKER" "$COMMIT" "$CONTENT_COMMIT" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
